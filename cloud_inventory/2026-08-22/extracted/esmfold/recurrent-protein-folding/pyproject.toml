[project]
name = "recurrent-protein-folding"
version = "0.1.0"
description = "Toy recurrent protein folding dynamics with physical and reachability losses."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "tqdm>=4.66",
  "h5py>=3.16.0",
  "accelerate>=0.27",
  "transformers>=4.40",
  "imageio[ffmpeg]>=2.37.3",
  "pillow>=12.2.0",
  "matplotlib>=3.10.9",
]

[tool.uv]
package = false
