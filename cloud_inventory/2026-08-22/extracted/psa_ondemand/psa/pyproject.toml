[project]
name = "psa"
version = "0.0.1"
description = "Physical-system-bottleneck autoencoder for protein folding model interpretability"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.30",
    "numpy>=1.24,<2.0",
    "biotite>=0.40",
    "mdtraj>=1.10",
    "biopython>=1.83",
    "einops>=0.7",
    "hydra-core>=1.3",
    "wandb>=0.16",
    "tqdm>=4.66",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipykernel", "matplotlib", "seaborn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
